<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka Ev Fiyat Tahmini</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://i1-e.pinimg.com/1200x/97/41/61/974161ada4f6782b21c171a8bba137d3.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            flex-direction: column;
        }

        h1 {
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 380px;
        }

        input, select, button {
            padding: 14px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }

        input, select {
            background: rgba(255, 255, 255, 0.9);
            color: #333;
        }

        button {
            background-color: #ff4d4d;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #ff3333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 77, 77, 0.4);
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: rgba(46, 204, 113, 0.3);
            backdrop-filter: blur(5px);
            border-radius: 15px;
            text-align: center;
            font-weight: 600;
            border: 1px solid rgba(46, 204, 113, 0.5);
            width: 380px;
        }
    </style>
</head>
<body>

    <h1>Ev Fiyat Tahmini</h1>

    <form action="/predict" method="post">
        <input type="number" name="metrekare" placeholder="Metrekare (Örn: 120)" required>
        <input type="number" name="oda" placeholder="Oda Sayısı (Örn: 3)" required>
        
        <select name="sehir" required>
            <option value="" disabled selected>İl Seçiniz</option>
            {% for sehir in sehirler %}
            <option value="{{ sehir }}">{{ sehir }}</option>
            {% endfor %}
        </select>

        <select name="ilce" required>
            <option value="" disabled selected>İlçe Seçiniz</option>
            {% for ilce in ilceler %}
            <option value="{{ ilce }}">{{ ilce }}</option>
            {% endfor %}
        </select>

        <select name="mahalle" required>
            <option value="" disabled selected>Mahalle Seçiniz</option>
            {% for mahalle in mahalleler %}
            <option value="{{ mahalle }}">{{ mahalle }}</option>
            {% endfor %}
        </select>

        <select name="satici" required>
            <option value="" disabled selected>Satıcı Tipi</option>
            {% for tip in satici_tipleri %}
            <option value="{{ tip }}">{{ tip }}</option>
            {% endfor %}
        </select>
        
        <button type="submit">Fiyatı Tahmin Et</button>
    </form>

    {% if tahmin_sonucu %}
    <div class="result">
        🏠 Tahmini Piyasa Değeri: <br>
        <span style="font-size: 24px;">{{ tahmin_sonucu }} TL</span>
    </div>
    {% endif %}

</body>
</html>
