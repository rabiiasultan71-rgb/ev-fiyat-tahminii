<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yapay Zeka Ev Fiyat Tahmini</title>
    <style>
        body {
           
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 400px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: none;
            outline: none;
        }
        button {
            width: 100%;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #2ecc71; }
        .result {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #f1c40f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Ev Fiyat Tahmini</h2>
        <form action="/predict" method="post">
            <input type="number" name="metrekare" placeholder="Metrekare (Örn: 120)" required>
            <input type="number" name="oda" placeholder="Oda Sayısı (Örn: 3)" required>
            
            <select name="sehir" required>
                <option value="" disabled selected>Şehir Seçiniz</option>
                {% for sehir in sehirler %}
                <option value="{{ sehir }}">{{ sehir }}</option>
                {% endfor %}
            </select>
            
            <button type="submit">Tahmin Et</button>
        </form>

        {% if tahmin_sonucu %}
        <div class="result">
            Tahmini Fiyat: {{ tahmin_sonucu }} TL
        </div>
        {% endif %}
    </div>
</body>
</html>
