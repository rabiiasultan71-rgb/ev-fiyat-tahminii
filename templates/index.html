<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yapay Zeka Ev Fiyat Tahmini</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('arka-plan.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: white;
            flex-direction: column;
        }

        form {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 350px;
        }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        button {
            background-color: #ff4d4d;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff3333;
            transform: scale(1.02);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 255, 0, 0.2);
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Ev Fiyat Tahmini</h1>

    <form action="/predict" method="post">
        <input type="number" name="metrekare" placeholder="Metrekare (Örn: 120)" required>
        <input type="number" name="oda" placeholder="Oda Sayısı (Örn: 3)" required>
        
        <select name="sehir" required>
            <option value="" disabled selected>İl Seçiniz</option>
            {% for sehir in sehirler %}
            <option value="{{ sehir }}">{{ sehir }}</option>
            {% endfor %}
        </select>

        <select name="ilce" required>
            <option value="" disabled selected>İlçe Seçiniz</option>
            {% for ilce in ilceler %}
            <option value="{{ ilce }}">{{ ilce }}</option>
            {% endfor %}
        </select>

        <select name="mahalle" required>
            <option value="" disabled selected>Mahalle Seçiniz</option>
            {% for mahalle in mahalleler %}
            <option value="{{ mahalle }}">{{ mahalle }}</option>
            {% endfor %}
        </select>

        <select name="satici" required>
            <option value="" disabled selected>Satıcı Tipi</option>
            {% for tip in satici_tipleri %}
            <option value="{{ tip }}">{{ tip }}</option>
            {% endfor %}
        </select>
        
        <button type="submit">Tahmin Et</button>
    </form>

    {% if tahmin_sonucu %}
    <div class="result">
        Tahmini Fiyat: {{ tahmin_sonucu }} TL
    </div>
    {% endif %}

</body>
</html>
