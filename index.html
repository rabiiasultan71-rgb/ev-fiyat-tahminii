<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Ev Fiyat Tahmini</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f4; }
        .container { background: white; padding: 20px; display: inline-block; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { padding: 10px; margin: 10px; width: 200px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistem İş Akışı: Ev Fiyat Tahmini</h1>
        <form action="/predict" method="post">
            <input type="number" name="metrekare" placeholder="Metrekare (Örn: 120)" required><br>
            <input type="number" name="oda" placeholder="Oda Sayısı (Örn: 3)" required><br>
            <button type="submit">Tahmin Al (Adım 6-7)</button>
        </form>

        {% if tahmin_sonucu %}
            <h2 style="color: #007bff;">Nihai Tahmin Sonucu: {{ tahmin_sonucu }} TL</h2>
        {% endif %}
    </div>
</body>
</html>
